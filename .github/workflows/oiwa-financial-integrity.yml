name: OJa-WA integrity

on:
  push:
    branches: [main, "feature/**", "institutional/**"]
  pull_request:
  workflow_dispatch:

jobs:
  rspec:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: oja_wa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d oja_wa_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/oja_wa_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false
      - name: Prepare deterministic Linux bundle
        run: |
          gem install bundler -v 4.0.17 --no-document
          bundle lock --add-platform x86_64-linux
          bundle config set --local path vendor/bundle
          bundle check || bundle install --jobs 4 --retry 3
          bundle check
      - name: Verify Spree release family
        run: |
          bundle exec ruby -rbundler -e '
            lock = Bundler::LockfileParser.new(File.read("Gemfile.lock"))
            specs = lock.specs_by_name.transform_values { |specs| specs.map(&:version).map(&:to_s).uniq }
            abort("spree core family mismatch: #{specs["spree"].inspect}") unless specs["spree"]&.all? { |v| v.start_with?("4.7.") }
            abort("spree backend family mismatch: #{specs["spree_backend"].inspect}") unless specs["spree_backend"]&.all? { |v| v.start_with?("4.7.") }
            abort("spree emails family mismatch: #{specs["spree_emails"].inspect}") unless specs["spree_emails"]&.all? { |v| v.start_with?("4.7.") }
            abort("spree frontend family mismatch: #{specs["spree_frontend"].inspect}") unless specs["spree_frontend"]&.all? { |v| v.start_with?("4.7.") }
            abort("spree auth-devise family mismatch: #{specs["spree_auth_devise"].inspect}") unless specs["spree_auth_devise"]&.all? { |v| v.start_with?("4.6.") }
          '
      - name: Syntax check
        run: |
          ruby -c app/models/spree/plan_allocation.rb
          ruby -c app/models/spree/allocation_ledger_entry.rb
          ruby -c app/models/spree/funding_ingress.rb
          ruby -c app/services/spree/financial/invariants.rb
          ruby -c app/services/spree/funding/issue.rb
          ruby -c app/services/spree/allocation/ledger_operation.rb
          ruby -c app/services/spree/allocation/reserve.rb
      - name: Test application
        run: bundle exec rake test_app
      - name: Financial integrity specs
        run: |
          bundle exec rspec spec/services/spree/allocation_financial_integrity_spec.rb
          bundle exec rspec spec/services/spree/payment_capture_spec.rb
          bundle exec rspec spec/services/spree/order_lifecycle_integrity_spec.rb

