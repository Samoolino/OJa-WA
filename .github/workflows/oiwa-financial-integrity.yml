name: OJa-WA integrity

on:
  push:
    branches: [main, "feature/**", "institutional/**"]
  pull_request:
  workflow_dispatch:

jobs:
  rspec:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: oja_wa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d oja_wa_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/oja_wa_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false
      - name: Install dependencies from committed lockfile
        run: |
          gem install bundler -v 2.5.23 --no-document
          bundle config set --local path vendor/bundle
          bundle config set --local deployment true
          bundle check || bundle install --jobs 4 --retry 3
          bundle check
      - name: Verify committed Spree release family
        run: |
          bundle exec ruby -rbundler -e '
            lock = Bundler::LockfileParser.new(File.read("Gemfile.lock"))
            specs = lock.specs_by_name.transform_values { |items| items.map(&:version).map(&:to_s).uniq }
            checks = {
              "spree" => /^4\.7\./,
              "spree_backend" => /^4\.7\./,
              "spree_emails" => /^4\.7\./,
              "spree_frontend" => /^4\.7\./,
              "spree_auth_devise" => /^4\.6\./
            }
            checks.each do |name, pattern|
              versions = specs[name]
              abort("missing #{name}") if versions.nil? || versions.empty?
              abort("#{name} incompatible: #{versions.inspect}") unless versions.all? { |version| version.match?(pattern) }
            end
          '
      - name: Syntax check
        run: |
          ruby -c app/models/spree/plan_allocation.rb
          ruby -c app/models/spree/allocation_ledger_entry.rb
          ruby -c app/models/spree/funding_ingress.rb
          ruby -c app/services/spree/financial/invariants.rb
          ruby -c app/services/spree/funding/issue.rb
          ruby -c app/services/spree/allocation/ledger_operation.rb
          ruby -c app/services/spree/allocation/reserve.rb
          ruby -c app/services/spree/payment/evidence_ingestion.rb
          ruby -c app/services/spree/reconciliation/compare.rb
          ruby -c app/services/spree/payment/capture_allocation.rb
          ruby -c app/services/spree/payment/capture_order_split.rb
          ruby -c app/services/spree/fulfillment/create.rb
          ruby -c app/services/spree/fulfillment/transition.rb
          ruby -c app/services/spree/settlement/build.rb
          ruby -c app/services/spree/settlement/eligibility.rb
          ruby -c app/services/spree/settlement/request_transfer.rb
          ruby -c app/services/spree/payment/refund_allocation.rb
          ruby -c spec/services/spree/g2_transaction_path_spec.rb
      - name: Test application
        run: bundle exec rake test_app
      - name: Financial integrity specs
        run: |
          bundle exec rspec spec/services/spree/allocation_financial_integrity_spec.rb
          bundle exec rspec spec/services/spree/payment_capture_spec.rb
          bundle exec rspec spec/services/spree/order_lifecycle_integrity_spec.rb
          bundle exec rspec spec/services/spree/g2_transaction_path_spec.rb
